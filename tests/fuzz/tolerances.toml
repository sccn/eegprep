# Tolerances are changed only by reviewed human pull requests.
# Agents must not loosen these values to hide mismatches.
#
# EEGLAB output is the oracle. A sample matches when
# abs(python - oracle) <= abs + rel * abs(oracle), the same rule as
# numpy.allclose. pop_clean_rawdata ASR-only cases use [clean_asr].

[pop_eegfiltnew]
abs = 1.0e-7
rel = 1.0e-7

[pop_reref]
abs = 1.0e-6
rel = 1.0e-6

[pop_resample]
abs = 1.0e-8
rel = 1.0e-5

[clean_asr]
abs = 0.0
rel = 1.0e-6

# Proposed sections below await Suraj/Arno approval.
# They are not accepted tolerances. Do not loosen them to hide a mismatch.
# u = 2^-53. meta_rel is 4*u, and 2*u for pop_epoch.
# Data that is a copy or a selection is compared exactly.
# pop_rmbase abs covers a mean of n=30720 samples from eeglab_data_with_ica_tmp.set.
# M is that file's max abs amplitude plus the 50 uV hf artifact.
# (2*n+4)*u*M = 3.9548e-9, so the proposal is 4.0e-9.
# pop_epoch event_latency_abs covers latency rebuilt from a non-dyadic limit.

[eeg_eegrej]
abs = 0.0
rel = 0.0
event_latency_abs = 0.0
meta_rel = 4.440892098500626e-16

