name: Nightly differential fuzz

on:
  schedule:
    # 10:23 UTC. An odd minute avoids the top-of-hour Actions rush.
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz EEGPrep against EEGLAB
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # MATLAB batch licensing token (MathWorks pilot). It licenses matlab-batch
      # only, not the Engine API for Python, so the oracle is
      # tests/matlab/eegprep_batch_engine_serve.m (client: tests/matlab_batch_engine.py).
      MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Require MATLAB batch token
        shell: bash
        run: |
          if [[ -z "$MLM_LICENSE_TOKEN" ]]; then
            echo "::error::MLM_LICENSE_TOKEN is empty; the nightly oracle cannot start"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --python 3.12 --group dev

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >-
            MATLAB
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Locate MATLAB root
        shell: bash
        run: |
          MATLAB_ROOT=$(python - <<'PY'
          import os
          from pathlib import Path
          tool_cache = Path(os.environ.get("RUNNER_TOOL_CACHE", "")) / "MATLAB"
          candidates = sorted(tool_cache.glob("*/x64"))
          if not candidates:
              raise SystemExit(f"No MATLAB installation found under {tool_cache}")
          print(candidates[-1])
          PY
          )
          echo "MATLAB_ROOT=$MATLAB_ROOT" >> "$GITHUB_ENV"
          echo "$MATLAB_ROOT/bin" >> "$GITHUB_PATH"

      - name: Fetch EEGLAB plugin submodules
        shell: bash
        working-directory: src/eegprep/eeglab
        run: |
          for path in $(git config -f .gitmodules --get-regexp path | awk '{print $2}'); do
            if ! git submodule update --init --recursive --depth 1 -- "$path"; then
              echo "::warning title=EEGLAB plugin unavailable::Could not fetch $path; fuzz cases needing it will fail"
            fi
          done

      - name: Start MATLAB through matlab-batch
        id: matlab-batch
        shell: bash
        run: |
          BATCH_DIR="$RUNNER_TEMP/eegprep-matlab-batch"
          mkdir -p "$BATCH_DIR"
          nohup matlab-batch "addpath('$GITHUB_WORKSPACE/tests/matlab'); eegprep_batch_engine_serve('$BATCH_DIR')" \
            > "$BATCH_DIR/server.log" 2>&1 &
          echo $! > "$BATCH_DIR/server.pid"
          for i in $(seq 1 180); do
            [[ -f "$BATCH_DIR/ready" ]] && break
            if ! kill -0 "$(cat "$BATCH_DIR/server.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ ! -f "$BATCH_DIR/ready" ]]; then
            echo "::error title=MATLAB did not start::see server.log below"
            cat "$BATCH_DIR/server.log"
            exit 1
          fi
          echo "EEGPREP_MATLAB_BATCH_DIR=$BATCH_DIR" >> "$GITHUB_ENV"
          echo "EEGPREP_EEGLAB_ROOT=$GITHUB_WORKSPACE/src/eegprep/eeglab" >> "$GITHUB_ENV"

      - name: Ensure fuzz labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh label create fuzz --color B60205 --description "Nightly differential fuzz finding" || true
          gh label create fuzz-unconfirmed --color FBCA04 --description "Fuzz divergence not yet triaged by a human" || true

      - name: Run differential fuzz
        shell: bash
        run: |
          uv run --no-sync python -m tests.fuzz run \
            --output fuzz-out \
            --examples 4 \
            --shrink-budget 12 \
            --max-shrinks 4 \
            --file-issues

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-repros
          path: fuzz-out/

      - name: Stop MATLAB
        if: always() && steps.matlab-batch.outcome == 'success'
        shell: bash
        run: |
          touch "$EEGPREP_MATLAB_BATCH_DIR/quit"
          for i in $(seq 1 30); do
            kill -0 "$(cat "$EEGPREP_MATLAB_BATCH_DIR/server.pid")" 2>/dev/null || break
            sleep 1
          done
          echo "--- matlab-batch server log (tail)"
          tail -n 60 "$EEGPREP_MATLAB_BATCH_DIR/server.log" | grep -v "$MLM_LICENSE_TOKEN" || true
