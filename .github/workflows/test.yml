name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  # Set MATLAB batch licensing token for private repos or when using MATLAB Engine
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run pre-commit checks
        run: |
          ./pre-commit.py --changed-from "origin/${{ github.base_ref }}"

  lint:
    name: Ruff and ty
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: |
          uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --python 3.12 --all-extras --group dev

      - name: Run Ruff lint
        run: |
          uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: |
          uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: |
          uv run --no-sync ty check

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.12", "3.13"]
        include:
          # Test on macOS and Windows for Python 3.12 only
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Determine MATLAB availability
        id: matlab-availability
        shell: bash
        run: |
          # Skip MATLAB on macOS and Windows, only enable on Ubuntu if token available
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]] && [[ -n "$MLM_LICENSE_TOKEN" ]]; then
            available=true
          else
            available=false
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          echo "EEGPREP_SKIP_MATLAB=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras --group dev

      - name: Set up MATLAB
        if: steps.matlab-availability.outputs.available == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: MATLAB

      - name: Locate MATLAB root
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          MATLAB_ROOT=$(python - <<'PY'
          import os
          from pathlib import Path
          tool_cache = Path(os.environ.get("RUNNER_TOOL_CACHE", "")) / "MATLAB"
          candidates = sorted(tool_cache.glob("*/x64"))
          if not candidates:
              raise SystemExit(f"No MATLAB installation found under {tool_cache}")
          print(candidates[-1])
          PY
          )
          echo "MATLAB_ROOT=$MATLAB_ROOT" >> $GITHUB_ENV
          echo "$MATLAB_ROOT/bin" >> $GITHUB_PATH

      - name: Install Python MATLAB Engine
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          # Each MATLAB release ships one engine build covering a fixed set of Python
          # versions, and R2024b stops at 3.12:
          #   "MATLAB Engine for Python supports Python version 3.9, 3.10, 3.11, and
          #    3.12, but your version of Python is 3.13"
          # A Python version the pinned release does not cover is not a CI failure. It
          # means the MATLAB parity tests cannot run, which the availability check below
          # already handles by falling through to the plain pytest step. Letting the
          # install decide keeps this working automatically once a newer MATLAB release
          # covers the version, instead of encoding a compatibility table here.
          if ! uv pip install "${MATLAB_ROOT}/extern/engines/python"; then
            echo "MATLAB engine does not support Python ${{ matrix.python-version }}; MATLAB parity tests will be skipped"
          fi

      - name: Check MATLAB Engine availability
        id: matlab-engine-availability
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          if uv run --no-sync python - <<'PY'
          import matlab.engine
          eng = matlab.engine.start_matlab()
          eng.quit()
          PY
          then
            echo "EEGPREP_SKIP_MATLAB=0" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "EEGPREP_SKIP_MATLAB=1" >> "$GITHUB_ENV"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run MATLAB tests
        if: steps.matlab-engine-availability.outputs.available == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: "ver"

      - name: Run Python tests via MATLAB batch
        if: steps.matlab-engine-availability.outputs.available == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: |
            [status, cmdout] = system('uv run --no-sync pytest tests');
            disp(cmdout);
            if status ~= 0
                error('Python tests failed');
            end

      - name: Run Python tests
        if: steps.matlab-engine-availability.outputs.available != 'true'
        run: |
          uv run --no-sync pytest tests

      # eegprep-lean is a second distribution in this repo (ADR 0069) and the root
      # suite's `testpaths = ["tests"]` does not reach it, so without this step it ships
      # with lint as its only gate. Run from its own directory so its pyproject supplies
      # the `network` marker, with src on the path because the package is deliberately
      # not installed into this environment: it must keep working with no dependencies.
      # The network tier is excluded here and runs in lean-live.yml on a schedule, so a
      # NEMAR outage cannot turn every unrelated pull request red.
      - name: Run eegprep-lean tests
        if: always()
        working-directory: packages/eegprep-lean
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          uv run --no-sync --project ../.. pytest tests -m "not network"

      # The store and window modules need the zarr extra, and skip without it, so the
      # step above proves only that they skip. This installs it so they actually run.
      # zarr is not added to the dev environment because the base install must keep
      # working with nothing present, which the step above is what verifies.
      - name: Run eegprep-lean tests with the zarr extra
        if: always()
        working-directory: packages/eegprep-lean
        # bash on every OS, as the steps above do. The default shell on windows-latest
        # is PowerShell, where a trailing backslash is not a line continuation but a
        # command to run, and `Failed to spawn: \` is the only clue you get -- printed
        # after a fully green test run.
        shell: bash
        run: |
          uv run --isolated --with 'zarr==3.4.0' --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      # And the plot extra on its own, not alongside zarr. window.py imports zarr inside
      # read_window rather than at module scope precisely so this tier stands alone, and
      # a stray module-scope import would otherwise only show up in a browser, where the
      # zarr install is the awkward one.
      - name: Run eegprep-lean tests with the plot extra
        if: always()
        working-directory: packages/eegprep-lean
        shell: bash
        run: |
          uv run --isolated --with matplotlib --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      # Both extras, which is the install a real session has. The three tiers above each
      # prove a tier stands alone; this one is the only place the cross-extra paths run,
      # such as reading a window and then plotting it.
      - name: Run eegprep-lean tests with both extras
        if: always()
        working-directory: packages/eegprep-lean
        shell: bash
        run: |
          uv run --isolated --with 'zarr==3.4.0' --with matplotlib --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      - name: Display installed packages
        if: always()
        run: |
          uv pip list
