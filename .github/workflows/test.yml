name: Tests

on:
  push:
    branches: [ master, develop, epic/324-pyodide-browser ]
  pull_request:
    branches: [ master, develop, epic/324-pyodide-browser ]

env:
  # Set MATLAB batch licensing token for private repos or when using MATLAB Engine
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run pre-commit checks
        run: |
          ./pre-commit.py --changed-from "origin/${{ github.base_ref }}"

  lint:
    name: Ruff and ty
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: |
          uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --python 3.12 --all-extras --group dev

      - name: Run Ruff lint
        run: |
          uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: |
          uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: |
          uv run --no-sync ty check

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.12", "3.13"]
        include:
          # Test on macOS and Windows for Python 3.12 only
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Determine MATLAB availability
        id: matlab-availability
        shell: bash
        run: |
          # Skip MATLAB on macOS and Windows, only enable on Ubuntu if token available
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]] && [[ -n "$MLM_LICENSE_TOKEN" ]]; then
            available=true
          else
            available=false
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          echo "EEGPREP_SKIP_MATLAB=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --all-extras --group dev

      - name: Set up MATLAB
        if: steps.matlab-availability.outputs.available == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: MATLAB

      - name: Locate MATLAB root
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          MATLAB_ROOT=$(python - <<'PY'
          import os
          from pathlib import Path
          tool_cache = Path(os.environ.get("RUNNER_TOOL_CACHE", "")) / "MATLAB"
          candidates = sorted(tool_cache.glob("*/x64"))
          if not candidates:
              raise SystemExit(f"No MATLAB installation found under {tool_cache}")
          print(candidates[-1])
          PY
          )
          echo "MATLAB_ROOT=$MATLAB_ROOT" >> "$GITHUB_ENV"
          echo "$MATLAB_ROOT/bin" >> "$GITHUB_PATH"

      - name: Install Python MATLAB Engine
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          # Each MATLAB release ships one engine build covering a fixed set of Python
          # versions, and R2024b stops at 3.12:
          #   "MATLAB Engine for Python supports Python version 3.9, 3.10, 3.11, and
          #    3.12, but your version of Python is 3.13"
          # A Python version the pinned release does not cover is not a CI failure. It
          # means the MATLAB parity tests cannot run, which the availability check below
          # already handles by falling through to the plain pytest step. Letting the
          # install decide keeps this working automatically once a newer MATLAB release
          # covers the version, instead of encoding a compatibility table here.
          if ! uv pip install "${MATLAB_ROOT}/extern/engines/python"; then
            echo "MATLAB engine does not support Python ${{ matrix.python-version }}; MATLAB parity tests will be skipped"
          fi

      - name: Check MATLAB Engine availability
        id: matlab-engine-availability
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          if uv run --no-sync python - <<'PY'
          import matlab.engine
          eng = matlab.engine.start_matlab()
          eng.quit()
          PY
          then
            echo "EEGPREP_SKIP_MATLAB=0" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "EEGPREP_SKIP_MATLAB=1" >> "$GITHUB_ENV"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run MATLAB tests
        if: steps.matlab-engine-availability.outputs.available == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: "ver"

      - name: Run Python tests via MATLAB batch
        if: steps.matlab-engine-availability.outputs.available == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: |
            [status, cmdout] = system('uv run --no-sync pytest tests');
            disp(cmdout);
            if status ~= 0
                error('Python tests failed');
            end

      - name: Run Python tests
        if: steps.matlab-engine-availability.outputs.available != 'true'
        run: |
          uv run --no-sync pytest tests

      - name: Display installed packages
        if: always()
        run: |
          uv pip list

  pyodide:
    name: Pyodide harness, ICA benchmark, and ICLabel browser parity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python 3.12
        run: |
          uv python install 3.12

      - name: Install benchmark dependencies
        run: |
          uv sync --python 3.12 --group dev --extra iclabel --extra torch

      - name: Build EEGPrep wheel from the working tree
        run: |
          mkdir -p pyodide-artifacts
          uv build --wheel --out-dir pyodide-artifacts

      - name: Regenerate and validate ICLabel quantized artifacts
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/iclabel-quantized"
          report_path="$candidate_dir/parity_report.json"
          uv run --no-sync python tools/iclabel/quantize_iclabel_onnx.py \
            --output-dir "$candidate_dir" \
            --report "$report_path" \
            > pyodide-artifacts/iclabel-quantization.log
          uv run --no-sync python - "$report_path" "$candidate_dir/iclabel_int8_weight_only.onnx" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text())
          selected = report["default_artifact"]
          if selected != "iclabel_int8_weight_only.onnx":
              raise SystemExit(f"unexpected selected ICLabel artifact: {selected}")
          if not report["candidates"]["weight_only"]["gate_pass"]:
              raise SystemExit("regenerated weight-only ICLabel artifact failed its parity gate")
          generated = Path(sys.argv[2]).read_bytes()
          shipped = Path("src/eegprep/plugins/ICLabel/iclabel.onnx").read_bytes()
          if generated != shipped:
              raise SystemExit("shipped iclabel.onnx differs from the regenerated selected artifact")
          committed = json.loads(Path("tools/iclabel/parity_report.json").read_text())
          if report["candidates"]["weight_only"]["sha256"] != committed["candidates"]["weight_only"]["sha256"]:
              raise SystemExit("committed ICLabel parity report is stale relative to regenerated artifact")
          PY

      - name: Build the locked docopt wheel
        run: |
          uv run --no-sync python tools/pyodide/prepare_docopt_wheel.py \
            --output-dir pyodide-artifacts/docopt

      - name: Validate Node runner argument handling
        run: |
          if output=$(node tools/pyodide/run_pyodide.mjs --not-a-real-option 2>&1); then
            echo "The runner accepted an invalid option" >&2
            exit 1
          fi
          grep -q "Usage:" <<< "$output"

      - name: Run Pyodide sample-data smoke test
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/smoke.py \
            --sample-data-dir sample_data \
            2>&1 | tee pyodide-artifacts/pyodide-smoke.log

      - name: Run native ICLabel parity reference
        env:
          MNE_CONFIGDIR: ${{ runner.temp }}/mne
        run: |
          uv run --no-sync python tools/pyodide/iclabel_parity.py \
            --platform native \
            --sample-data-dir sample_data \
            > pyodide-artifacts/iclabel-native.json

      - name: Run browser ICLabel parity through Pyodide
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --iclabel-web \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/iclabel_parity.py \
            --sample-data-dir sample_data \
            --output pyodide-artifacts/iclabel-pyodide.json \
            -- --platform pyodide \
            2>&1 | tee pyodide-artifacts/iclabel-pyodide.log

      - name: Compare ICLabel browser parity
        run: |
          set -o pipefail
          uv run --no-sync python tools/pyodide/compare_iclabel.py \
            --native pyodide-artifacts/iclabel-native.json \
            --pyodide pyodide-artifacts/iclabel-pyodide.json \
            --report pyodide-artifacts/iclabel-parity.md \
            | tee pyodide-artifacts/iclabel-parity.json

      - name: Run native ICA and matmul benchmark
        env:
          MNE_CONFIGDIR: ${{ runner.temp }}/mne
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          uv run --no-sync python tools/pyodide/benchmark.py \
            --platform native \
            > pyodide-artifacts/benchmark-native.json

      - name: Run Pyodide ICA and matmul benchmark
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/benchmark.py \
            --output pyodide-artifacts/benchmark-pyodide.json \
            -- --platform pyodide \
            2>&1 | tee pyodide-artifacts/benchmark-pyodide.log

      - name: Compare benchmark gates
        run: |
          set -o pipefail
          uv run --no-sync python tools/pyodide/compare_benchmarks.py \
            --native pyodide-artifacts/benchmark-native.json \
            --pyodide pyodide-artifacts/benchmark-pyodide.json \
            --report pyodide-artifacts/benchmark-comparison.md \
            | tee pyodide-artifacts/benchmark-comparison.json

      - name: Upload Pyodide raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-phase-2-through-phase-6-output
          path: pyodide-artifacts
