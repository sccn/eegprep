name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  # MATLAB batch licensing token (MathWorks pilot, license 1144083, expires
  # 2027-01-15). It licenses matlab-batch only, not the Engine API for Python,
  # so the parity tests reach MATLAB through tests/matlab/eegprep_batch_engine_serve.m
  # running inside matlab-batch (client: tests/matlab_batch_engine.py).
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run pre-commit checks
        run: |
          ./pre-commit.py --changed-from "origin/${{ github.base_ref }}"

  lint:
    name: Ruff and ty
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: |
          uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --python 3.12 --all-extras --group dev

      - name: Run Ruff lint
        run: |
          uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: |
          uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: |
          uv run --no-sync ty check

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.12", "3.13"]
        include:
          # Test on macOS and Windows for Python 3.12 only
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the vendored EEGLAB reference itself, but not EEGLAB's nested
          # plugin submodules; upstream EEGLAB can temporarily point at plugin
          # commits that are unavailable for shallow GitHub Actions checkout.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Determine MATLAB availability
        id: matlab-availability
        shell: bash
        run: |
          # Skip MATLAB on macOS and Windows, only enable on Ubuntu if token available
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]] && [[ -n "$MLM_LICENSE_TOKEN" ]]; then
            available=true
          else
            available=false
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          echo "EEGPREP_SKIP_MATLAB=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras --group dev

      - name: Set up MATLAB
        if: steps.matlab-availability.outputs.available == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          # EEGLAB's reference functions need resample/firls/pwelch and the
          # statistics functions (tcdf, ttest, kmeans, ...).
          products: >-
            MATLAB
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Locate MATLAB root
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          MATLAB_ROOT=$(python - <<'PY'
          import os
          from pathlib import Path
          tool_cache = Path(os.environ.get("RUNNER_TOOL_CACHE", "")) / "MATLAB"
          candidates = sorted(tool_cache.glob("*/x64"))
          if not candidates:
              raise SystemExit(f"No MATLAB installation found under {tool_cache}")
          print(candidates[-1])
          PY
          )
          echo "MATLAB_ROOT=$MATLAB_ROOT" >> $GITHUB_ENV
          echo "$MATLAB_ROOT/bin" >> $GITHUB_PATH

      - name: Fetch EEGLAB plugin submodules
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        working-directory: src/eegprep/eeglab
        run: |
          # One plugin at a time: a missing upstream commit costs one plugin, not the lane.
          for path in $(git config -f .gitmodules --get-regexp path | awk '{print $2}'); do
            if ! git submodule update --init --recursive --depth 1 -- "$path"; then
              echo "::warning title=EEGLAB plugin unavailable::Could not fetch $path; parity tests needing it will fail"
            fi
          done

      - name: Start MATLAB through matlab-batch
        id: matlab-batch
        if: steps.matlab-availability.outputs.available == 'true'
        shell: bash
        run: |
          BATCH_DIR="$RUNNER_TEMP/eegprep-matlab-batch"
          mkdir -p "$BATCH_DIR"
          nohup matlab-batch "addpath('$GITHUB_WORKSPACE/tests/matlab'); eegprep_batch_engine_serve('$BATCH_DIR')" \
            > "$BATCH_DIR/server.log" 2>&1 &
          echo $! > "$BATCH_DIR/server.pid"
          for i in $(seq 1 180); do
            [[ -f "$BATCH_DIR/ready" ]] && break
            if ! kill -0 "$(cat "$BATCH_DIR/server.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ ! -f "$BATCH_DIR/ready" ]]; then
            echo "::error title=MATLAB did not start::see server.log below"
            cat "$BATCH_DIR/server.log"
            exit 1
          fi
          echo "EEGPREP_MATLAB_BATCH_DIR=$BATCH_DIR" >> "$GITHUB_ENV"
          echo "EEGPREP_SKIP_MATLAB=0" >> "$GITHUB_ENV"

      - name: Run Python tests
        run: |
          uv run --no-sync pytest tests

      - name: Stop MATLAB
        if: always() && steps.matlab-batch.outcome == 'success'
        shell: bash
        run: |
          touch "$EEGPREP_MATLAB_BATCH_DIR/quit"
          for i in $(seq 1 30); do
            kill -0 "$(cat "$EEGPREP_MATLAB_BATCH_DIR/server.pid")" 2>/dev/null || break
            sleep 1
          done
          echo "--- matlab-batch server log (tail)"
          tail -n 60 "$EEGPREP_MATLAB_BATCH_DIR/server.log" | grep -v "$MLM_LICENSE_TOKEN" || true

      # eegprep-lean is a second distribution in this repo (ADR 0069) and the root
      # suite's `testpaths = ["tests"]` does not reach it, so without this step it ships
      # with lint as its only gate. Run from its own directory so its pyproject supplies
      # the `network` marker, with src on the path because the package is deliberately
      # not installed into this environment: it must keep working with no dependencies.
      # The network tier is excluded here and runs in lean-live.yml on a schedule, so a
      # NEMAR outage cannot turn every unrelated pull request red.
      - name: Run eegprep-lean tests
        if: always()
        working-directory: packages/eegprep-lean
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          uv run --no-sync --project ../.. pytest tests -m "not network"

      # The store and window modules need the zarr extra, and skip without it, so the
      # step above proves only that they skip. This installs it so they actually run.
      # zarr is not added to the dev environment because the base install must keep
      # working with nothing present, which the step above is what verifies.
      - name: Run eegprep-lean tests with the zarr extra
        if: always()
        working-directory: packages/eegprep-lean
        # bash on every OS, as the steps above do. The default shell on windows-latest
        # is PowerShell, where a trailing backslash is not a line continuation but a
        # command to run, and `Failed to spawn: \` is the only clue you get -- printed
        # after a fully green test run.
        shell: bash
        run: |
          uv run --isolated --with 'zarr==3.4.0' --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      # And the plot extra on its own, not alongside zarr. window.py imports zarr inside
      # read_window rather than at module scope precisely so this tier stands alone, and
      # a stray module-scope import would otherwise only show up in a browser, where the
      # zarr install is the awkward one.
      - name: Run eegprep-lean tests with the plot extra
        if: always()
        working-directory: packages/eegprep-lean
        shell: bash
        run: |
          uv run --isolated --with matplotlib --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      # Both extras, which is the install a real session has. The three tiers above each
      # prove a tier stands alone; this one is the only place the cross-extra paths run,
      # such as reading a window and then plotting it.
      - name: Run eegprep-lean tests with both extras
        if: always()
        working-directory: packages/eegprep-lean
        shell: bash
        run: |
          uv run --isolated --with 'zarr==3.4.0' --with matplotlib --with pytest \
            python -m pytest tests -m "not network" -p no:cacheprovider

      - name: Display installed packages
        if: always()
        run: |
          uv pip list

  pyodide:
    name: Pyodide harness, ICA benchmark, and ICLabel browser parity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # tools/pyodide/run_pyodide.sh installs the pinned Pyodide and ONNX Runtime
      # Web packages with `bun install --frozen-lockfile` from tools/pyodide/bun.lock;
      # Node.js above still runs the harness.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Python 3.12
        run: |
          uv python install 3.12

      - name: Install benchmark dependencies
        run: |
          uv sync --python 3.12 --group dev --extra iclabel --extra torch

      - name: Build EEGPrep wheel from the working tree
        run: |
          mkdir -p pyodide-artifacts
          uv build --wheel --out-dir pyodide-artifacts

      # The documented regeneration sequence from tools/iclabel/quantize_iclabel_onnx.py:
      # export the float32 network from netICL.mat, quantize it, and require the
      # gate to pass against the frozen teacher probabilities and the result to be
      # numerically identical to the shipped model on the evaluation features. A
      # fresh PyTorch export is not guaranteed to be byte-identical across PyTorch
      # versions, so bytes are not compared. The committed parity report must
      # record the shipped model's SHA-256, which release.yml checks again.
      - name: Regenerate the ICLabel model from netICL.mat
        run: |
          set -euo pipefail
          regenerated="$RUNNER_TEMP/iclabel-regenerated"
          uv run --no-sync python tools/iclabel/export_iclabel_onnx.py \
            --onnx-path "$regenerated/iclabel_float32.onnx"
          uv run --no-sync python tools/iclabel/quantize_iclabel_onnx.py \
            --float32-artifact "$regenerated/iclabel_float32.onnx" \
            --output "$regenerated/iclabel.onnx" \
            --report "$regenerated/parity_report.json" \
            --require-identical-to src/eegprep/plugins/ICLabel/iclabel.onnx \
            > pyodide-artifacts/iclabel-quantization.log
          shipped_sha256=$(sha256sum src/eegprep/plugins/ICLabel/iclabel.onnx | cut -d' ' -f1)
          recorded_sha256=$(python3 -c 'import json; print(json.load(open("tools/iclabel/parity_report.json"))["packaged_model"]["sha256"])')
          if [ "$shipped_sha256" != "$recorded_sha256" ]; then
            echo "::error::tools/iclabel/parity_report.json does not describe the shipped iclabel.onnx; regenerate them together"
            exit 1
          fi

      - name: Build the locked docopt wheel
        run: |
          uv run --no-sync python tools/pyodide/prepare_docopt_wheel.py \
            --output-dir pyodide-artifacts/docopt

      - name: Validate Node runner argument handling
        run: |
          if output=$(node tools/pyodide/run_pyodide.mjs --not-a-real-option 2>&1); then
            echo "The runner accepted an invalid option" >&2
            exit 1
          fi
          grep -q "Usage:" <<< "$output"

      - name: Run Pyodide sample-data smoke test
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/smoke.py \
            --sample-data-dir sample_data \
            2>&1 | tee pyodide-artifacts/pyodide-smoke.log

      - name: Run native ICLabel parity reference
        env:
          MNE_CONFIGDIR: ${{ runner.temp }}/mne
        run: |
          uv run --no-sync python tools/pyodide/iclabel_parity.py \
            --platform native \
            --sample-data-dir sample_data \
            > pyodide-artifacts/iclabel-native.json

      - name: Run browser ICLabel parity through Pyodide
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --iclabel-web \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/iclabel_parity.py \
            --sample-data-dir sample_data \
            --output pyodide-artifacts/iclabel-pyodide.json \
            -- --platform pyodide \
            2>&1 | tee pyodide-artifacts/iclabel-pyodide.log

      - name: Compare ICLabel browser parity
        run: |
          set -o pipefail
          uv run --no-sync python tools/pyodide/compare_iclabel.py \
            --native pyodide-artifacts/iclabel-native.json \
            --pyodide pyodide-artifacts/iclabel-pyodide.json \
            --report pyodide-artifacts/iclabel-parity.md \
            | tee pyodide-artifacts/iclabel-parity.json

      - name: Run native ICA and matmul benchmark
        env:
          MNE_CONFIGDIR: ${{ runner.temp }}/mne
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          uv run --no-sync python tools/pyodide/benchmark.py \
            --platform native \
            > pyodide-artifacts/benchmark-native.json

      - name: Run Pyodide ICA and matmul benchmark
        run: |
          set -o pipefail
          tools/pyodide/run_pyodide.sh \
            --wheel "$(find pyodide-artifacts -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            --docopt-wheel "$(find pyodide-artifacts/docopt -maxdepth 1 -type f -name 'docopt-0.6.2-*.whl' -print -quit)" \
            --script tools/pyodide/benchmark.py \
            --output pyodide-artifacts/benchmark-pyodide.json \
            -- --platform pyodide \
            2>&1 | tee pyodide-artifacts/benchmark-pyodide.log

      - name: Compare benchmark gates
        run: |
          set -o pipefail
          uv run --no-sync python tools/pyodide/compare_benchmarks.py \
            --native pyodide-artifacts/benchmark-native.json \
            --pyodide pyodide-artifacts/benchmark-pyodide.json \
            --report pyodide-artifacts/benchmark-comparison.md \
            | tee pyodide-artifacts/benchmark-comparison.json

      - name: Upload Pyodide raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-harness-output
          path: pyodide-artifacts
