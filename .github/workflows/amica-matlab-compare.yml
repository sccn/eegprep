name: AMICA MATLAB compare

on:
  workflow_dispatch:
  # Temporary: workflow_dispatch is only available once this file is on the
  # default branch. This push trigger starts the comparison from this branch.
  push:
    branches:
      - agent/20261007-fix-435

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_BATCH_TOKEN }}

jobs:
  amica:
    name: AMICA MATLAB input comparison
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --all-extras --group dev

      - name: Require MATLAB batch token
        run: |
          if [[ -z "$MLM_LICENSE_TOKEN" ]]; then
            echo "::error title=MATLAB batch token missing::MATLAB_BATCH_TOKEN is not available to this workflow"
            exit 1
          fi

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: MATLAB

      - name: Locate MATLAB root
        shell: bash
        run: |
          MATLAB_ROOT=$(python3 - <<'PY'
          import os
          from pathlib import Path
          tool_cache = Path(os.environ.get("RUNNER_TOOL_CACHE", "")) / "MATLAB"
          candidates = sorted(tool_cache.glob("*/x64"))
          if not candidates:
              raise SystemExit(f"No MATLAB installation found under {tool_cache}")
          print(candidates[-1])
          PY
          )
          echo "MATLAB_ROOT=$MATLAB_ROOT" >> "$GITHUB_ENV"
          echo "$MATLAB_ROOT/bin" >> "$GITHUB_PATH"

      - name: Start MATLAB through matlab-batch
        id: matlab-batch
        shell: bash
        run: |
          BATCH_DIR="$RUNNER_TEMP/eegprep-matlab-batch"
          mkdir -p "$BATCH_DIR"
          echo "PMI_RANK=0" >> "$GITHUB_ENV"
          echo "PMI_SIZE=1" >> "$GITHUB_ENV"
          echo "OMP_STACKSIZE=512M" >> "$GITHUB_ENV"
          echo "KMP_STACKSIZE=512M" >> "$GITHUB_ENV"
          ulimit -s unlimited || true
          export PMI_RANK=0 PMI_SIZE=1 OMP_STACKSIZE=512M KMP_STACKSIZE=512M
          nohup matlab-batch "addpath('$GITHUB_WORKSPACE/tests/matlab'); eegprep_batch_engine_serve('$BATCH_DIR')" \
            > "$BATCH_DIR/server.log" 2>&1 &
          echo $! > "$BATCH_DIR/server.pid"
          for i in $(seq 1 180); do
            [[ -f "$BATCH_DIR/ready" ]] && break
            if ! kill -0 "$(cat "$BATCH_DIR/server.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ ! -f "$BATCH_DIR/ready" ]]; then
            echo "::error title=MATLAB did not start::see server.log below"
            cat "$BATCH_DIR/server.log"
            exit 1
          fi
          echo "EEGPREP_MATLAB_BATCH_DIR=$BATCH_DIR" >> "$GITHUB_ENV"

      - name: Compare AMICA input with MATLAB fwrite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p amica-compare
          AMICA_SRC="$RUNNER_TEMP/amica-src"
          git clone --filter=blob:none https://github.com/sccn/amica.git "$AMICA_SRC"
          git -C "$AMICA_SRC" checkout 2b364cd4a995c057a06409de55f0b8ada8a0f1d8
          cp src/eegprep/bin/amica15ub "$AMICA_SRC/amica15ex"
          chmod +x "$AMICA_SRC/amica15ex" src/eegprep/bin/amica15ub
          uv run --no-sync python tools/amica_matlab_compare.py \
            --amica-src "$AMICA_SRC" \
            --out amica-compare \
            | tee amica-compare/results.txt

      - name: Upload AMICA comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amica-matlab-compare
          path: amica-compare/
          if-no-files-found: warn

      - name: Stop MATLAB
        if: always() && steps.matlab-batch.outcome == 'success'
        shell: bash
        run: |
          touch "$EEGPREP_MATLAB_BATCH_DIR/quit"
          for i in $(seq 1 30); do
            kill -0 "$(cat "$EEGPREP_MATLAB_BATCH_DIR/server.pid")" 2>/dev/null || break
            sleep 1
          done
          echo "--- matlab-batch server log (tail)"
          tail -n 60 "$EEGPREP_MATLAB_BATCH_DIR/server.log" | grep -v "$MLM_LICENSE_TOKEN" || true
